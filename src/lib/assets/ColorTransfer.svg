<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- Red Source Circle -->
  <circle 
    cx="3" 
    cy="8" 
    r="2.5" 
    fill="#EF4444" 
    stroke="#FFFFFF" 
    stroke-width="0.8" 
  />

  <!-- Arrow with Outline (Pointing Left to Right) -->
  <path 
    d="M 5.5,7 H 8 V 5.5 L 10.5,8 L 8,10.5 V 9 H 5.5 Z" 
    fill="#FFFFFF" 
    stroke="#0F172A" 
    stroke-width="0.6" 
    stroke-linejoin="round"
  />

  <!-- Blue Target Circle -->
  <circle 
    cx="13" 
    cy="8" 
    r="2.5" 
    fill="#3B82F6" 
    stroke="#FFFFFF" 
    stroke-width="0.8" 
  />
</svg>
