<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Schatten fÃ¼r den Polaroid-Rahmen und Pinsel -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    <!-- FarbverlÃ¤ufe -->
    <!-- Hintergrund Foto Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="45%" stop-color="#7f00ff"/>
      <stop offset="85%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#ff5e00"/>
    </linearGradient>

    <!-- Farbwelle Top Gradient -->
    <linearGradient id="swooshTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d"/>
      <stop offset="25%" stop-color="#11998e"/>
      <stop offset="60%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#3a7bd5"/>
    </linearGradient>

    <!-- Farbwelle Bottom Gradient -->
    <linearGradient id="swooshGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00c6ff"/>
      <stop offset="50%" stop-color="#0072ff"/>
      <stop offset="100%" stop-color="#3a0099"/>
    </linearGradient>

    <!-- Holz-Verlauf Handle -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a2e14"/>
      <stop offset="25%" stop-color="#a05a2c"/>
      <stop offset="60%" stop-color="#d38e53"/>
      <stop offset="85%" stop-color="#8c471e"/>
      <stop offset="100%" stop-color="#421f0b"/>
    </linearGradient>

    <!-- Zwinge / Metall-Verlauf -->
    <linearGradient id="ferruleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1c232a"/>
      <stop offset="30%" stop-color="#455363"/>
      <stop offset="55%" stop-color="#8294a8"/>
      <stop offset="75%" stop-color="#323c48"/>
      <stop offset="100%" stop-color="#15191e"/>
    </linearGradient>

    <!-- Borsten / Pinselspitze Gradient -->
    <linearGradient id="bristleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="40%" stop-color="#0055ff"/>
      <stop offset="85%" stop-color="#001166"/>
      <stop offset="100%" stop-color="#000833"/>
    </linearGradient>

    <!-- Clip Path fÃ¼r das innere Foto -->
    <clipPath id="photoClip">
      <rect x="85" y="48" width="330" height="325" rx="2"/>
    </clipPath>
  </defs>

  <!-- Outer Dark Background Contour Optional / Frame Group -->
  <g filter="url(#drop-shadow)">
    <!-- POLAROID RAHMEN -->
    <rect x="60" y="25" width="380" height="430" rx="8" fill="#f4f4f6" stroke="#e1e1e6" stroke-width="2"/>
    <!-- Papier-Textur Linien-Akzent -->
    <rect x="61" y="26" width="378" height="428" rx="7" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
  </g>

  <!-- FOTO INHALT (GECLEPPT) -->
  <g clip-path="url(#photoClip)">
    <!-- Foto Hintergrund -->
    <rect x="85" y="48" width="330" height="325" fill="url(#bgGrad)"/>

    <!-- Farbspritzer im Hintergrund -->
    <!-- Cyan Klecks oben links -->
    <path d="M 110,60 C 130,50 160,70 180,60 C 200,50 210,80 230,75 C 250,70 240,110 260,130 C 270,140 240,150 230,170 C 210,180 210,210 180,200 C 150,200 140,230 120,210 C 100,200 80,180 95,150 C 100,120 80,100 100,80 Z" fill="#00f0ff" opacity="0.9"/>
    
    <!-- Magenta Klecks rechts unten -->
    <path d="M 280,200 C 310,180 340,210 370,190 C 390,200 400,240 410,270 C 420,300 380,320 390,350 C 370,360 340,340 320,360 C 290,360 280,320 260,300 C 250,280 280,260 270,230 Z" fill="#e00096" opacity="0.85"/>

    <!-- Violett Klecks Mitte -->
    <path d="M 180,150 C 220,130 250,160 280,180 C 300,210 290,250 260,270 C 230,280 200,310 170,280 C 150,260 170,220 150,190 C 140,170 160,160 180,150 Z" fill="#7b00ff" opacity="0.7"/>

    <!-- Kleine Spritzer Punkte -->
    <circle cx="120" cy="100" r="6" fill="#00f0ff"/>
    <circle cx="100" cy="120" r="3" fill="#00f0ff"/>
    <circle cx="260" cy="80" r="5" fill="#00f0ff"/>
    <circle cx="280" cy="105" r="3" fill="#00f0ff"/>
    <circle cx="390" cy="210" r="7" fill="#ff00a0"/>
    <circle cx="370" cy="170" r="4" fill="#ff00a0"/>
    <circle cx="150" cy="240" r="5" fill="#7b00ff"/>
    <circle cx="310" cy="330" r="8" fill="#e00096"/>
    <circle cx="340" cy="350" r="4" fill="#00f0ff"/>
  </g>

  <!-- Foto Innenschatten/Rahmen Kante -->
  <rect x="85" y="48" width="330" height="325" fill="none" stroke="#100020" stroke-width="3" opacity="0.25"/>

  <!-- DYNAMISCHE FARBWELLE (SCHWUNG) & SPRITZER LINKS -->
  <g filter="url(#soft-shadow)">
    <!-- Spritzer links auÃŸen -->
    <!-- GroÃŸer Tropfen oben -->
    <path d="M 45,210 C 25,180 10,185 18,210 C 22,225 35,235 45,210 Z" fill="#00c6ff" stroke="#12192c" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Mittlerer Hauptspritzer -->
    <path d="M 55,255 C 20,240 -5,220 2,245 C 8,265 30,270 50,275 Z" fill="#00d2ff" stroke="#12192c" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Tropfen unten -->
    <path d="M 40,290 C 20,300 15,320 28,320 C 38,320 48,305 40,290 Z" fill="#0088ff" stroke="#12192c" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Kleine fliegende Punkte -->
    <circle cx="12" cy="200" r="4" fill="#00d2ff" stroke="#12192c" stroke-width="2"/>
    <circle cx="28" cy="175" r="3" fill="#00f0ff" stroke="#12192c" stroke-width="1.5"/>
    <circle cx="8" cy="275" r="3.5" fill="#0072ff" stroke="#12192c" stroke-width="1.5"/>

    <!-- Haupt-Farbwelle (Dunklere Unterseite) -->
    <path d="M 45,270 C 100,380 230,390 380,240 C 350,290 240,365 110,335 C 70,325 45,300 45,270 Z" fill="#101968" stroke="#12192c" stroke-width="4" stroke-linejoin="round"/>

    <!-- Haupt-Farbwelle (KÃ¶rper mit Verlauf) -->
    <path d="M 38,265 C 90,360 220,370 385,215 C 330,225 210,310 65,250 C 45,240 30,245 38,265 Z" fill="url(#swooshGrad)" stroke="#12192c" stroke-width="4" stroke-linejoin="round"/>

    <!-- Farbwelle Glanz/Oberseite (Hellblau/TÃ¼rkis) -->
    <path d="M 50,252 C 120,320 230,310 385,215 C 310,210 190,280 65,248 C 52,242 45,245 50,252 Z" fill="url(#swooshTop)" opacity="0.9"/>
    
    <!-- Licht-Glanzstreifen -->
    <path d="M 75,258 C 140,315 220,300 330,228" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- PINSEL (PINSELKOPF, ZWINGE, HOLZGRIFF) -->
  <!-- Angewinkelt und positioniert Ã¼ber die Transformation -->
  <g transform="translate(235, 450) rotate(-44)" filter="url(#drop-shadow)">
    
    <!-- 1. HOLZGRIFF -->
    <!-- Griff Schatten / Dunkler Umriss -->
    <path d="M -26,-135 C -30,-210 -28,-300 -6,-390 C -2,-400 2,-400 6,-390 C 28,-300 30,-210 26,-135 Z" fill="url(#woodGrad)" stroke="#12192c" stroke-width="4.5" stroke-linejoin="round"/>
    
    <!-- Holzmaserung / Details -->
    <path d="M -16,-160 C -20,-230 -18,-310 -4,-370" fill="none" stroke="#361705" stroke-width="2" opacity="0.4"/>
    <path d="M 0,-140 C -2,-210 5,-280 12,-350" fill="none" stroke="#361705" stroke-width="2.5" opacity="0.35"/>
    <path d="M 14,-150 C 18,-220 16,-290 4,-370" fill="none" stroke="#f3b172" stroke-width="2" opacity="0.3"/>
    <!-- Lichtreflexion auf dem Holz (Rechte Seite) -->
    <path d="M 12,-140 C 22,-210 21,-290 4,-385" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.25"/>

    <!-- 2. METALL-ZWINGE (FERRULE) -->
    <path d="M -27,-135 L -31,-85 L 31,-85 L 27,-135 Z" fill="url(#ferruleGrad)" stroke="#12192c" stroke-width="4.5" stroke-linejoin="round"/>
    <!-- Zwingen-Rillen & Glanz -->
    <line x1="-29" y1="-110" x2="29" y2="-110" stroke="#12192c" stroke-width="2.5"/>
    <line x1="-30" y1="-98" x2="30" y2="-98" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
    <line x1="-28" y1="-122" x2="28" y2="-122" stroke="#ffffff" stroke-width="1.5" opacity="0.3"/>

    <!-- 3. PINSELSPITZE / BORSTEN (NASS MIT FARBE) -->
    <!-- Dunkle Basis/Schatten der Borsten -->
    <path d="M -31,-85 C -35,-50 -25,-20 0,25 C 25,-20 35,-50 31,-85 Z" fill="#030a24" stroke="#12192c" stroke-width="4.5" stroke-linejoin="round"/>
    
    <!-- Haupt-Farbtropfen / Spitze mit Verlauf -->
    <path d="M -29,-85 C -34,-52 -22,-22 0,18 C 22,-22 34,-52 29,-85 Z" fill="url(#bristleGrad)"/>

    <!-- Borsten-Textur / Striche -->
    <path d="M -18,-85 C -20,-60 -12,-30 0,5" fill="none" stroke="#00d2ff" stroke-width="2" opacity="0.6"/>
    <path d="M -8,-85 C -10,-55 -5,-25 0,12" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
    <path d="M 10,-85 C 12,-60 8,-30 0,5" fill="none" stroke="#0033aa" stroke-width="2" opacity="0.7"/>

    <!-- Highlight-Glanz auf der Haube -->
    <path d="M -25,-75 C -28,-55 -20,-35 -8,-10" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.65"/>
    
    <!-- Farb-Tropfen an der Pinselspitze -->
    <circle cx="-3" cy="22" r="3.5" fill="#00d2ff" stroke="#12192c" stroke-width="1.5"/>
  </g>
</svg>

